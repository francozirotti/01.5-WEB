server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # /ruta -> /ruta/ sin reescribir esquema ni host (TLS lo termina el proxy delante)
    absolute_redirect off;

    # Un único dominio canónico: zirotti.com -> www.zirotti.com
    if ($host = zirotti.com) {
        return 301 https://www.zirotti.com$request_uri;
    }

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json application/xml text/xml image/svg+xml text/plain;

    # URLs antiguas del sitio anterior -> nuevas (301 conserva la señal de enlace)
    # (/index.html se redirige mirando $request_uri: nginx sirve "/" con una
    # redirección interna a /index.html y, sin esta comprobación, entraría en bucle)
    location = /index.html {
        if ($request_uri ~ "^/index\.html") { return 301 /; }
        try_files $uri =404;
    }
    location = /forma.html  { return 301 /formacion-ia-project-management/; }
    location = /asesora.html { return 301 /asesoria-estrategica-inversion/; }
    location = /dirige.html  { return 301 /direccion-fractional-expansion/; }
    location = /legal.html   { return 301 /legal/; }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Recursos estáticos: el CSS/JS llevan ?v=hash, así que se pueden cachear mucho
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location ~* ^/(favicon\.svg|apple-touch-icon\.png)$ {
        expires 30d;
    }

    # HTML: siempre revalidar
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
